# Development: dotnet watch for C#, the Vite dev server for pages (HMR on 5173). Open http://localhost:8080, or the port
# APP_PORT names; VITE_PORT moves Vite. Both ports are bound to localhost only: dev error pages show stack traces and
# Vite serves the source.
services:
  app:
    build:
      target: dev
    environment:
      # The browser loads modules from http://localhost:<port>, so Vite listens on the port the host publishes: the same
      # number inside and out.
      Netjes__ViteDevPort: "${VITE_PORT:-5173}"
    ports:
      # The host's port for the app: APP_PORT, from the shell or a .env file next to this file, or 8080.
      - "127.0.0.1:${APP_PORT:-8080}:8080"
      # Vite's: VITE_PORT, from the same places, or 5173.
      - "127.0.0.1:${VITE_PORT:-5173}:${VITE_PORT:-5173}"
    volumes:
      - .:/src
      # Keep the container's own installs and build output out of the bind mount.
      - /src/node_modules
      - /src/bin
      - /src/obj
      # The Data Protection keys, where ASP.NET Core keeps them for the dev container's root user: they sign the
      # antiforgery tokens, so on a volume a rebuild does not fail the forms of pages that were open.
      - dev-dataprotection:/root/.aspnet/DataProtection-Keys

volumes:
  dev-dataprotection:
