# Releases a tagged version: checks and tests the tag, packs the npm package and both NuGet packages, then, once a
# maintainer approves the "release" environment, publishes them and creates the GitHub release. RELEASING.md has the
# setup it needs (the environment, its secrets, the registries' trusted publishing) and the steps for a release.
# Every publishing step skips what is already published, so a failed run can be run again.
name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to release, such as v0.0.1. It must point at a commit whose CI run on main passed.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  build:
    name: Check, test and pack
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read # to find the tag's CI run
    outputs:
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false

      # No caches in a release build: what it packs comes from the registries and the tag alone.
      - uses: ./.github/actions/setup
        with:
          npm-cache: 'off'
          nuget-cache: 'off'

      - name: The tag names the version every package carries
        id: check
        run: node scripts/release.mjs check "$TAG" --repository "$GITHUB_REPOSITORY" >> "$GITHUB_OUTPUT"

      # The full gate (both end-to-end suites and the package check) ran in CI; this run repeats the fast part.
      - name: CI passed on main for the tag's commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          commit=$(git rev-parse HEAD)
          passed=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --event push \
            --commit "$commit" --status success --json databaseId --jq length)
          if [ "$passed" -eq 0 ]; then
            echo "::error::No successful CI run on main for $commit ($TAG). Tag a commit of main whose CI passed."
            exit 1
          fi

      - name: Build the package and the examples
        run: npm run build

      - name: Type check
        run: npm run typecheck

      - name: JavaScript tests
        run: npm test

      - name: Generated types are current
        run: |
          (cd examples/Blog && npx netjes generate --check)
          (cd examples/TaskBoard && npx netjes generate --check)

      - name: .NET tests
        run: dotnet test Netjes.slnx -c Release

      - name: Pack
        run: |
          out="$RUNNER_TEMP/packages"
          dotnet pack src/Netjes/Netjes.csproj -c Release -o "$out" --nologo -p:ContinuousIntegrationBuild=true
          dotnet pack src/Netjes.Images.SkiaSharp/Netjes.Images.SkiaSharp.csproj -c Release -o "$out" --nologo \
            -p:ContinuousIntegrationBuild=true
          (cd packages/netjes && npm pack --pack-destination "$out")

      - name: The packages carry the version
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: node scripts/release.mjs packages "$VERSION" "$RUNNER_TEMP/packages"

      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: node scripts/release.mjs notes "$VERSION" > "$RUNNER_TEMP/release-notes.md"

      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: ${{ runner.temp }}/packages/
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error

  # NuGet first: an app that `netjes new` scaffolds from the npm package restores the NuGet packages of its version.
  publish:
    name: Publish to nuget.org and npm
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: release
      url: https://www.npmjs.com/package/netjes/v/${{ needs.build.outputs.version }}
    permissions:
      contents: read
      id-token: write # NuGet trusted publishing and npm provenance
    env:
      VERSION: ${{ needs.build.outputs.version }}
      PRERELEASE: ${{ needs.build.outputs.prerelease }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: packages

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # npm trusted publishing (OIDC) needs npm 11.5.1 or later; Node 22 comes with npm 10.
      - name: Install npm 11
        run: npm install --global npm@11.21.1

      # Exchanges the job's OIDC token for an API key that is valid for an hour (nuget.org trusted publishing).
      - name: Log in to nuget.org
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          for package in "Netjes.$VERSION.nupkg" "Netjes.Images.SkiaSharp.$VERSION.nupkg"; do
            dotnet nuget push "packages/$package" --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json --skip-duplicate
          done

      # npm tries trusted publishing first and falls back to NPM_TOKEN, which the first release needs: npm configures
      # a trusted publisher on a package that exists.
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ "$(npm view "netjes@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
            echo "netjes@$VERSION is on npm already."
            exit 0
          fi
          dist_tag=latest
          if [ "$PRERELEASE" = true ]; then
            dist_tag=next
          fi
          npm publish "./packages/netjes-$VERSION.tgz" --provenance --access public --tag "$dist_tag"

  github-release:
    name: GitHub release
    needs: [build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # to create the release
    env:
      TAG: ${{ inputs.tag }}
      VERSION: ${{ needs.build.outputs.version }}
      PRERELEASE: ${{ needs.build.outputs.prerelease }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: packages

      - uses: actions/download-artifact@v8
        with:
          name: release-notes
          path: notes

      - name: Create the release
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "The release $TAG exists already."
            exit 0
          fi
          prerelease=()
          if [ "$PRERELEASE" = true ]; then
            prerelease=(--prerelease)
          fi
          gh release create "$TAG" packages/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "Netjes $VERSION" \
            --notes-file notes/release-notes.md "${prerelease[@]}"
