# Base definition: the production image. docker-compose.override.yml (loaded automatically) switches to dev;
# docker-compose.prod.yml publishes it for real use. Ports live in those files.
services:
  blog:
    # Always build: `up -d` must not reuse a stale image (or a dev one) after a pull.
    pull_policy: build
    build:
      context: .
      dockerfile: examples/Blog/Dockerfile
      target: production
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 60s
      retries: 3
