# TaskBoard: Postgres, a one-off migration step, and the app. compose.override.yaml (loaded automatically) turns this
# into the dev setup; compose.prod.yaml publishes it for real use, behind a proxy that terminates TLS. Copy .env.example
# to .env first.
name: taskboard

services:
  db:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Migrations are an explicit step, never part of app start-up (replicas would race).
  migrate:
    pull_policy: build # never reuse a stale image after a pull
    build:
      context: ../..
      dockerfile: examples/TaskBoard/Dockerfile
      target: production
    command: ["migrate"]
    environment:
      ConnectionStrings__TaskBoard: Host=db;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    pull_policy: build
    build:
      context: ../..
      dockerfile: examples/TaskBoard/Dockerfile
      target: production
    environment:
      ConnectionStrings__TaskBoard: Host=db;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 60s
      retries: 3

volumes:
  pgdata:
