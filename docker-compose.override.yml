# Development: dotnet watch for C#, the Vite dev server for pages (HMR on 5173). Open http://localhost:8080.
# Both ports are bound to localhost only: dev error pages show stack traces and Vite serves the source.
services:
  blog:
    # Its own image name: the production image is named after the compose project, and a dev image must never be reused for it.
    image: netjes-blog-dev
    build:
      target: dev
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:5173:5173"
    volumes:
      - .:/src
      # Keep the container's own installs and build output out of the bind mount.
      - /src/node_modules
      - /src/examples/Blog/node_modules
      - /src/packages/netjes/node_modules
      - /src/packages/netjes/dist
      - /src/examples/Blog/bin
      - /src/examples/Blog/obj
      - /src/src/Netjes/bin
      - /src/src/Netjes/obj
      - /src/src/Netjes.Images.SkiaSharp/bin
      - /src/src/Netjes.Images.SkiaSharp/obj
